<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartInvest AI - Intelligent Wealth Management</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-900">
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; background: #fef9c3; color: #713f12;">
        Enable JavaScript to run SmartInvest. This app requires a modern browser with scripts enabled.
      </div>
    </noscript>
    <div id="root">
      <div id="si-boot-placeholder" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#0f172a;color:#cbd5f5;font-family:system-ui,sans-serif;font-size:14px;padding:2rem;text-align:center;max-width:32rem;margin:0 auto;">
        <div>Loading SmartInvest…</div>
        <p id="si-boot-hint" style="font-size:12px;color:#94a3b8;max-width:28rem;line-height:1.5;margin:0;"></p>
      </div>
    </div>
    <script>
      (function () {
        var hint = document.getElementById('si-boot-hint');
        if (!hint) return;
        setTimeout(function () {
          if (!document.getElementById('si-boot-placeholder')) return;
          hint.textContent =
            'If this does not go away, the app bundle did not start. Open DevTools (F12) → Console and Network, confirm the URL matches the "Local" line from the terminal (e.g. http://localhost:3000), then hard-refresh (⌘⇧R).';
        }, 8000);
      })();
    </script>
    <!-- Explicit module entry point to resolve blank page issues -->
    <script type="module" src="/index.tsx" onerror="var h=document.getElementById('si-boot-hint');if(h)h.textContent='Could not load /index.tsx (Network tab). Run npm run dev from the repo root and open the exact Local URL printed there (port may be 3001 if 3000 is busy).';"></script>
</body>
</html>
